name: pkg-cleanup
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #!/usr/bin/env bash
          # Delete the leftover GHCR probe package zz-probe-test.
          #
          # This package was created by a throwaway probe in any1tan/dsh-purge (run
          # 40439490291, 2026-10-27T02:37:17Z), so the package's repository association
          # is dsh-purge -- NOT zombiecouple-co. A GITHUB_TOKEN from a different repo
          # can GET the package but DELETE returns 404 ("Package not found"), which is
          # how the earlier zombiecouple-co audit silently reported a false "clean".
          #
          # Run this from the owning repo (dsh-purge). Truth source is the registry
          # (tags/list), never the DELETE response code.
          set +e
          
          PKG=zz-probe-test
          OWNER=any1tan
          GH_TOKEN="${GH_TOKEN:?need GH_TOKEN}"
          
          reg_tags() {
            local pt code body
            pt=$(curl -sS "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/${PKG}:pull" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' 2>/dev/null)
            if [ -z "$pt" ]; then
              echo "  registry: no pull token (package absent or unreadable) => GONE"
              return 0
            fi
            body=$(curl -sS -H "Authorization: Bearer $pt" "https://ghcr.io/v2/${OWNER}/${PKG}/tags/list")
            code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $pt" \
              "https://ghcr.io/v2/${OWNER}/${PKG}/tags/list")
            echo "  registry tags/list HTTP=$code body=$body"
            case "$body" in
              *'"tags":[]'*|*'"tags": []'*) echo "  registry: empty tag list => GONE" ;;
            esac
          }
          
          echo "### 1. package detail (who owns it, which repo is it linked to) ###"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PKG}" -o /tmp/pkg.json -w "  HTTP=%{http_code}\n"
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("/tmp/pkg.json"))
          except Exception as e:
              print("  parse error:", e); raise SystemExit
          print("  id=%s name=%s visibility=%s" % (d.get("id"), d.get("name"), d.get("visibility")))
          print("  owner=%s" % (d.get("owner") or {}).get("login"))
          r = d.get("repository")
          print("  linked_repo=%s" % ((r or {}).get("full_name") if r else "(none)"))
          PY
          echo
          echo "### 2. registry truth BEFORE ###"
          reg_tags
          echo
          echo "### 3. delete each version ###"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PKG}/versions?per_page=100" \
            -o /tmp/vers.json -w "  list HTTP=%{http_code}\n"
          python3 - <<'PY' > /tmp/ids.txt 2>/dev/null
          import json
          try:
              d = json.load(open("/tmp/vers.json"))
              for v in (d if isinstance(d, list) else []):
                  print(v.get("id"))
          except Exception:
              pass
          PY
          while read -r vid; do
            [ -z "$vid" ] && continue
            echo "  -- version $vid --"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${PKG}/versions/${vid}" \
              -w "\n    HTTP=%{http_code}\n" | head -c 300
            echo
          done < /tmp/ids.txt
          echo
          echo "### 4. delete package ###"
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PKG}" \
            -w "\n  HTTP=%{http_code}\n" | head -c 400
          echo
          echo "### 5. registry truth AFTER (authoritative) ###"
          reg_tags
          echo
          echo "### done ###"
