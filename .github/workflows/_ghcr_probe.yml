name: ghcr-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: real-push-tiny-image
        run: |
          set -e
          mkdir -p /tmp/b && cd /tmp/b
          printf 'hello-ghcr-probe\n' > f.txt
          cat > Dockerfile <<'EOF'
          FROM scratch
          COPY f.txt /f.txt
          EOF
          docker build -t ghcr.io/any1tan/zz-probe-test:probe1 .
          echo "--- pushing ---"
          docker push ghcr.io/any1tan/zz-probe-test:probe1
          echo "--- digest ---"
          docker inspect ghcr.io/any1tan/zz-probe-test:probe1 --format '{{index .RepoDigests 0}}'
